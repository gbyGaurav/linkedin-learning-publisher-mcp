[project]
name = "linkedin-learning-publisher"
version = "2.0.0"
description = "LinkedIn Learning Publisher MCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "fastmcp",
    "playwright",
    "python-dotenv>=1.2.4",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line length
    "E402",   # module level import not at top of file
]
